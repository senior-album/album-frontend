name: npm-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # 도입 초기 soft-fail — findings 는 로그에서 확인, 점진 수정 후 strict 전환.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Run npm audit
        run: npm audit --audit-level=high
