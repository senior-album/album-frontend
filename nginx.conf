server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────── 보안 헤더 ───────────────────────────
    # XSS 자체를 못 터지게 하는 1차 방어선. 토큰은 httpOnly 쿠키라 이미 안전하지만
    # XSS 가 터지면 withCredentials=true 때문에 세션을 타고 임의 요청 가능 — 그래서
    # 여기서 script/connect 소스를 엄격히 제한한다.
    #
    # - script-src: 자체 도메인 + Kakao SDK (t1.kakaocdn.net) + Cloudflare Web
    #   Analytics (static.cloudflareinsights.com — CF 튜널이 beacon.min.js 를
    #   자동 주입). 'unsafe-inline' 없음 — index.html 에서 인라인 스크립트 제거됨.
    # - style-src: React 가 style={{...}} 를 DOM style 속성으로 렌더하므로
    #   'unsafe-inline' 이 필요. 스타일 인젝션은 스크립트 실행 불가.
    # - img-src: MinIO presigned URL 이 임의 HTTPS origin 일 수 있어 허용. data:
    #   는 React 내부 이미지, blob: 은 업로드 preview 용.
    # - connect-src: 자체 + CF Analytics 비콘 POST (cloudflareinsights.com).
    #   Kakao Share 활성화 시 https://kapi.kakao.com 추가 필요.
    # - frame-ancestors 'none': 클릭재킹 차단.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://t1.kakaocdn.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # React SPA — 모든 경로를 index.html로 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 프록시 → 백엔드
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 파일 업로드 크기 제한 (사진)
        client_max_body_size 50M;
    }

    # 정적 파일 캐싱.
    # 주의: nginx 는 nested 블록에 add_header 가 하나라도 있으면 상위 레벨
    # add_header 를 전부 상속하지 않는다. 따라서 보안 헤더(특히 nosniff) 를
    # 여기서 다시 선언한다. CSP 는 HTML 에만 의미가 있지만 일관성 위해 재선언.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://t1.kakaocdn.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
    }
}
